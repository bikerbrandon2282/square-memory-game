<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Brandon's Memory Game</title>
        <link rel="stylesheet" href="assets/css/style.css">
    </head>

    <body>
        <div>
            <h1 id="game-title">Brandon's Memory Game</h1>
        </div>
        
        <div class="container">
            <details id="instructions">
                <summary>Instructions (Click to expand)</summary>
                <p>Click the New Game button to start a new game. 
                    Watch the sequence of lights 
                    and repeat it in the same order.</p>
            </details>
            <div data-listener="false" class="square square1" id="button1"></div>
            <div data-listener="false" class="square square2" id="button2"></div>
            <div data-listener="false" class="square square3" id="button3"></div>
            <div data-listener="false" class="square square4" id="button4"></div>
            <div data-listener="false" class="square square5" id="button5"></div>
            <div data-listener="false" class="square square6" id="button6"></div>
            <div data-listener="false" class="square square7" id="button7"></div>
            <div data-listener="false" class="square square8" id="button8"></div>
            <div data-listener="false" class="square square9" id="button9"></div>
            <div id="leaderboards">
                <h2>Leaderboards</h2>
            </div>
            <div class="scorebox" id="score">0</div>
            <div class="scorebox" id="tryCount">3</div>
            <div id="new-game"><button class="button" onclick="newGame()">New Game</button></div>
        </div>
        
        <script src="assets/js/script.js"></script>
    </body>

</html>
